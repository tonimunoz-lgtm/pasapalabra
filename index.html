<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rosco con voz · 2 jugadores</title>
<style>
  :root{
    --bg: #0e1526;
    --bg-panel: #141d33;
    --bg-panel-2: #1b2540;
    --gold: #e8b34c;
    --gold-dim: #a97f2f;
    --cream: #f4ecd8;
    --muted: #8a93ab;
    --green: #4fd18b;
    --red: #f2646b;
    --line: #2a3555;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: radial-gradient(1400px 800px at 50% -10%, #1a2544 0%, var(--bg) 60%);
    color: var(--cream);
    min-height:100vh;
    padding: 24px 24px 50px;
  }
  .wrap{ max-width: 1500px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 18px; }
  header h1{ font-size: 1.6rem; letter-spacing: .02em; margin: 0 0 4px; font-weight: 700; }
  header h1 span{ color: var(--gold); }
  header p{ margin:0; color: var(--muted); font-size: .85rem; }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
  }

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
    margin-bottom: 16px;
  }
  button{
    font: inherit; font-weight: 600; font-size: .85rem;
    border: 1px solid var(--line); background: var(--bg-panel-2); color: var(--cream);
    padding: 10px 16px; border-radius: 9px; cursor: pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  button:hover{ border-color: var(--gold-dim); }
  button:active{ transform: scale(.96); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background: var(--gold); color:#231705; border-color: var(--gold); }
  button.primary:hover{ background:#f0c265; }
  button.danger{ background: transparent; color: var(--red); border-color: var(--red); }
  button.ghost{ background: transparent; }

  .timer{ font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 700; color: var(--gold); min-width: 84px; text-align:center; }
  select{ font: inherit; background: var(--bg-panel-2); color: var(--cream); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

  /* ---- Stage: big rosco + slim sidebar ---- */
  .stage{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 980px){ .stage{ grid-template-columns: 1fr; } }

  .rosco-panel{ display:flex; justify-content:center; padding: 32px; }
  .rosco-holder{
    position:relative;
    width: min(78vh, 78vw, 760px);
    aspect-ratio: 1 / 1;
  }
  .letter{
    position:absolute;
    width: clamp(38px, 4.6vw, 58px);
    height: clamp(38px, 4.6vw, 58px);
    left:0; top:0;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: clamp(1rem, 1.6vw, 1.3rem);
    background: var(--bg-panel-2); border: 2px solid var(--line);
    color: var(--muted);
    transform: translate(-50%,-50%);
    transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .letter.current{
    background: var(--gold); border-color: var(--gold); color:#231705;
    transform: translate(-50%,-50%) scale(1.22);
    box-shadow: 0 0 0 8px rgba(232,179,76,.16);
  }
  .letter.correct{ background: var(--green); border-color: var(--green); color:#082818; }
  .letter.wrong{ background: var(--red); border-color: var(--red); color:#2b0508; }
  .letter.passed{ border-color: var(--gold-dim); color: var(--gold-dim); }

  .rosco-center{
    position:absolute; inset: 21%; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: var(--bg-panel); border: 1px solid var(--line);
    text-align:center; padding: 4%;
  }
  .rc-letter{ font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; color: var(--gold); line-height:1; margin-bottom: .4em; }
  .rc-clue{ font-size: clamp(.95rem, 1.6vw, 1.3rem); line-height:1.45; max-width: 90%; }
  .rc-status{ margin-top: .8em; font-size: clamp(.7rem, 1.1vw, .85rem); color: var(--muted); }
  .rc-idle{ color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.4rem); }

  /* ---- Sidebar ---- */
  .sidebar{ display:flex; flex-direction:column; gap: 14px; }
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat{
    background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 8px; text-align:center;
  }
  .stat .n{ font-size: 1.5rem; font-weight: 800; color: var(--cream); }
  .stat .l{ font-size: .68rem; color: var(--muted); letter-spacing:.03em; margin-top: 2px; }
  .stat.green .n{ color: var(--green); }
  .stat.red .n{ color: var(--red); }
  .stat.gold .n{ color: var(--gold); }

  .mic-row{ display:flex; align-items:center; gap:10px; }
  .mic-dot{ width: 12px; height:12px; border-radius:50%; background: var(--line); flex-shrink:0; }
  .mic-dot.listening{ background: var(--red); animation: pulse 1.2s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(242,100,107,.5); }
    70%{ box-shadow: 0 0 0 10px rgba(242,100,107,0); }
    100%{ box-shadow: 0 0 0 0 rgba(242,100,107,0); }
  }
  .mic-status{ font-size: .8rem; color: var(--muted); }

  .legend{ font-size: .72rem; color: var(--muted); line-height: 1.6; }
  .legend b{ color: var(--cream); }

  /* ---- Bottom answer bar ---- */
  .answer-panel{ margin-top: 18px; }
  .answer-row{ display:flex; gap: 14px; align-items:stretch; flex-wrap: wrap; }
  .answer-box{
    flex: 1 1 320px;
    background: var(--bg-panel-2); border: 1px dashed var(--line);
    border-radius: 10px; padding: 14px 16px; min-height: 30px;
    font-size: 1.15rem; display:flex; align-items:center;
  }
  .answer-box.correct{ border-color: var(--green); background: rgba(79,209,139,.08); }
  .answer-box.wrong{ border-color: var(--red); background: rgba(242,100,107,.08); }
  .answer-box .placeholder{ color: var(--muted); font-style: italic; font-size:.9rem; }

  .verdict-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .verdict-row button{ flex: 1 1 130px; }

  textarea{
    width:100%; min-height: 220px; background: var(--bg-panel-2); color: var(--cream);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 13px/1.5 monospace;
    resize: vertical;
  }
  .edit-help{ font-size:.78rem; color: var(--muted); margin: 6px 0 10px; }
  .edit-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top: 10px; }

  .hint{ text-align:center; color: var(--muted); font-size:.75rem; margin-top: 16px; }
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(6,9,18,.72); display:none;
    align-items:center; justify-content:center; padding: 20px; z-index: 50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{ background: var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:20px; max-width: 640px; width:100%; }
  .modal h2{ margin-top:0; font-size:1.05rem; }

  /* ---- Modo dos jugadores ---- */
  .player-roscos{ position:relative; width:100%; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .player-card{ min-width:0; position:relative; padding:8px; border:1px solid transparent; border-radius:14px; transition:.2s ease; }
  .player-card.active{ border-color:var(--gold); background:rgba(232,179,76,.05); }
  .player-title{ display:flex; justify-content:space-between; align-items:center; font-size:.82rem; font-weight:800; margin:0 4px 6px; }
  .player-badge{ font-size:.65rem; color:var(--muted); padding:3px 7px; border:1px solid var(--line); border-radius:20px; }
  .player-card.active .player-badge{ color:#231705; background:var(--gold); border-color:var(--gold); }
  .player-roscos .rosco-h  <div class="stage" style="margin-top:16px;">
    <div class="panel rosco-panel">
      <div class="player-roscos">
        <div class="player-card active" id="playerCard0">
          <div class="player-title"><span>JUGADOR 1</span><span class="player-badge" id="badge0">TURNO</span></div>
          <div class="rosco-holder" id="rosco0"></div>
        </div>
        <div class="player-card" id="playerCard1">
          <div class="player-title"><span>JUGADOR 2</span><span class="player-badge" id="badge1">ESPERA</span></div>
          <div class="rosco-holder" id="rosco1"></div>
        </div>
        <div class="rosco-center" id="roscoCenter">
          <div class="rc-idle">Pulsa <b>Empezar</b><br>para jugar</div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="current-player" id="currentPlayerLabel">JUGADOR 1</div>
        <div class="stat-grid">
          <div class="stat green"><div class="n" id="stCorrect">0</div><div class="l">ACIERTOS</div></div>
          <div class="stat red"><div class="n" id="stWrong">0</div><div class="l">FALLOS</div></div>
          <div class="stat gold"><div class="n" id="stPass">0</div><div class="l">PASADAS</div></div>
          <div class="stat"><div class="n" id="stLeft">27</div><div class="l">RESTANTES</div></div>
        </div>
      </div>

      <div class="panel" id="playerStats">
        <div class="panel-title">Marcador</div>
        <div class="player-score-row" id="scoreRow0"><b>Jugador 1</b><span>0 aciertos · 0 fallos</span></div>
        <div class="player-score-row" id="scoreRow1"><b>Jugador 2</b><span>0 aciertos · 0 fallos</span></div>
      </div>

      <div class="panel">
        <div class="mic-row">
          <div class="mic-dot" id="micDot"></div>
          <div class="mic-status" id="micStatus">Micrófono inactivo</div>
        </div>
      </div>

      <div class="panel legend">
        <div><b>Enter</b> = correcta</div>
        <div><b>X</b> = incorrecta → cambia de jugador</div>
        <div><b>Espacio</b> = pasapalabra → cambia de jugador</div>
        <div><b>Solución</b> = mostrar respuesta</div>
        <div><b>Ctrl+R</b> = reiniciar</div>
        <div style="margin-top:6px;">Requiere Chrome o Edge + micrófono.</div>
      </div>
    </div>
  </div>

  <div class="panel answer-panel">
    <div class="answer-row">
      <div class="answer-box" id="answerBox"><span class="placeholder">Aquí aparecerá lo que digas…</span></div>
    </div>
    <div class="verdict-row" style="margin-top:12px;">
      <button id="btnCorrect" class="primary" disabled>✔ Correcta (Enter)</button>
      <button id="btnWrong" class="danger" disabled>✘ Incorrecta (X)</button>
      <button id="btnPass" class="ghost" disabled>⏭ Pasapalabra (Espacio)</button>
      <button id="btnSolution" class="ghost" disabled>💡 Solución</button>
      <button id="btnRepeat" class="ghost" disabled>🔊 Repetir pregunta</button>
    </div>
  </div>

<script>
// ---------- Datos por defecto ----------
const DEFAULT_WORDS = [
  ["A","Empieza por A: Estado de ánimo en el que no se siente nada de tristeza ni alegría","indiferencia"],
  ["B","Empieza por B: Instrumento de cuerda que se toca con arco, más grande que el violín","violonchelo"],
  ["C","Contiene la C: Fenómeno atmosférico eléctrico que va acompañado de trueno","rayo"],
  ["D","Empieza por D: Juego de mesa que se juega con fichas negras y blancas sobre un tablero","damas"],
  ["E","Empieza por E: Aparato que sirve para subir y bajar personas entre plantas de un edificio","ascensor"],
  ["F","Contiene la F: Instrumento óptico que sirve para ver objetos lejanos","catalejo"],
  ["G","Empieza por G: Ave de corral que en Navidad se suele comer asada","pavo"],
  ["H","Empieza por H: Deporte que se practica sobre hielo con un disco y un stick","hockey"],
  ["I","Contiene la I: Insecto que produce miel y vive en colmenas","abeja"],
  ["J","Empieza por J: Planta con espinas típica del desierto","cactus"],
  ["L","Empieza por L: Órgano del cuerpo humano encargado de filtrar la sangre","hígado"],
  ["M","Empieza por M: Instrumento que se usa para medir la temperatura corporal","termómetro"],
  ["N","Empieza por N: Planeta más alejado del Sol del sistema solar","neptuno"],
  ["Ñ","Contiene la Ñ: Hermano del cuñado","concuñado"],
  ["O","Contiene la O: Deporte en el que se intenta marcar goles con los pies","fútbol"],
  ["P","Empieza por P: Personaje de videojuego que es amarillo y puede lanzar electricidad","pikachu"],
  ["Q","Empieza por Q: Alimento lácteo que se utiliza mucho en pizzas","queso"],
  ["R","Empieza por R: Animal pequeño que tiene una cola larga y suele vivir en las casas o en el campo","ratón"],
  ["S","Empieza por S: Criatura fantástica que suele vivir en el mar y tiene forma de mujer con cola de pez","sirena"],
  ["T","Empieza por T: Red social conocida por sus vídeos cortos y bailes","tiktok"],
  ["U","Contiene la U: Animal fantástico parecido a un caballo que tiene un cuerno en la cabeza","unicornio"],
  ["V","Contiene la V: Medio de transporte que puede volar y lleva pasajeros","avión"],
  ["X","Empieza por X: Instrumento musical que se toca con dos baquetas","xilófono"],
  ["Y","Contiene la Y: Personaje de juguete vaquero de una famosa película de animación","woody"],
  ["Z","Empieza por Z: Animal que se parece a un perro y vive en manadas","zorro"]
];

let playerWords = [[], []];
let currentPlayer = 0;
let idx = [0, 0];
let timeLeft = [150, 150];
let timerId = null;
let running = false;
let paused = false;
let correctCount = [0, 0];
let wrongCount = [0, 0];
let passCount = [0, 0];
let recognition = null;
let recognizing = false;

const el = id => document.getElementById(id);

function normalize(s){
  return (s || "").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zñ0-9\s]/g,"").trim();
}

function similar(a,b){
  a = normalize(a); b = normalize(b);
  if(!a || !b) return false;
  if(a === b || a.includes(b) || b.includes(a)) return true;
  return levenshtein(a,b) <= Math.max(1, Math.floor(b.length * 0.25));
}

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++)
    for(let j=1;j<=n;j++)
      dp[i][j]=a[i-1]===b[j-1] ? dp[i-1][j-1] :
        1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function cloneWords(){
  return DEFAULT_WORDS.map(([letter,clue,answer]) =>
    ({letter,clue,answer,status:"pending"}));
}

function parseWords(text){
  const out=[];
  text.split("\n").forEach(line=>{
    const parts=line.split("|");
    if(parts.length>=3){
      const letter=parts[0].trim().toUpperCase();
      const clue=parts[1].trim();
      const answer=parts.slice(2).join("|").trim();
      if(letter && clue && answer) out.push({letter,clue,answer,status:"pending"});
    }
  });
  return out;
}

function wordsToText(list){
  return list.map(w=>`${w.letter}|${w.clue}|${w.answer}`).join("\n");
}

function loadDefault(){
  playerWords=[cloneWords(),cloneWords()];
  idx=[0,0];
}

function layoutRosco(player){
  const holder=el("rosco"+player);
  holder.querySelectorAll(".letter").forEach(n=>n.remove());
  const words=playerWords[player];
  const n=words.length;
  if(!n) return;
  const Rpct=42;
  words.forEach((w,i)=>{
    const angle=(i/n)*2*Math.PI-Math.PI/2;
    const d=document.createElement("div");
    d.className="letter";
    d.id=`P${player}L${i}`;
    d.textContent=w.letter;
    d.style.left=(50+Rpct*Math.cos(angle))+"%";
    d.style.top=(50+Rpct*Math.sin(angle))+"%";
    holder.appendChild(d);
  });
}

function layoutAllRoscos(){
  layoutRosco(0);
  layoutRosco(1);
}

function refreshRoscos(){
  for(let p=0;p<2;p++){
    playerWords[p].forEach((w,i)=>{
      const d=el(`P${p}L${i}`);
      if(!d) return;
      d.className="letter "+(p===currentPlayer && i===idx[p] && running ? "current " : "")+w.status;
    });
    el(`playerCard${p}`).classList.toggle("active",p===currentPlayer && running);
    el(`badge${p}`).textContent=p===currentPlayer && running ? "TURNO" : "ESPERA";
  }
  const remaining=playerWords[currentPlayer].filter(w=>w.status==="pending").length;
  el("stLeft").textContent=remaining;
}

function updateScore(){
  const p=currentPlayer;
  el("stCorrect").textContent=correctCount[p];
  el("stWrong").textContent=wrongCount[p];
  el("stPass").textContent=passCount[p];
  el("scoreRow0").innerHTML=`<b>Jugador 1</b><span>${correctCount[0]} aciertos · ${wrongCount[0]} fallos</span>`;
  el("scoreRow1").innerHTML=`<b>Jugador 2</b><span>${correctCount[1]} aciertos · ${wrongCount[1]} fallos</span>`;
  el("currentPlayerLabel").textContent=`JUGADOR ${currentPlayer+1}`;
}

function nextPendingIndex(player,from){
  const list=playerWords[player];
  const n=list.length;
  for(let step=1;step<=n;step++){
    const i=(from+step)%n;
    if(list[i].status==="pending") return i;
  }
  return -1;
}

function setVerdictButtons(enabled){
  el("btnCorrect").disabled=!enabled;
  el("btnWrong").disabled=!enabled;
  el("btnPass").disabled=!running;
  el("btnSolution").disabled=!running;
  el("btnRepeat").disabled=!running;
}

function startTurn(){
  if(!running || paused) return;

  const list=playerWords[currentPlayer];
  const w=list[idx[currentPlayer]];
  if(!w){ finishGame(); return; }

  el("answerBox").className="answer-box";
  el("answerBox").innerHTML='<span class="placeholder">Escuchando… habla cuando oigas la pregunta</span>';
  setVerdictButtons(false);

  el("roscoCenter").innerHTML=`
    <div class="rc-letter">${escapeHtml(w.letter)}</div>
    <div class="rc-clue">${escapeHtml(w.clue)}</div>
    <div class="rc-status" id="rcStatus">Jugador ${currentPlayer+1} · Escuchando…</div>`;

  refreshRoscos();
  updateScore();

  speak(`${w.letter}. ${w.clue}`,()=>{
    if(running && !paused) startListening();
  });
}

function speak(text,onEnd){
  if(!("speechSynthesis" in window)){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="es-ES";
  u.rate=1;
  u.onend=()=>{if(onEnd) onEnd();};
  window.speechSynthesis.speak(u);
}

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    el("micStatus").textContent="Este navegador no soporta reconocimiento de voz (usa Chrome o Edge).";
    return null;
  }
  const r=new SR();
  r.lang="es-ES";
  r.continuous=false;
  r.interimResults=true;
  r.onstart=()=>{
    recognizing=true;
    el("micDot").classList.add("listening");
    el("micStatus").textContent=`Escuchando al Jugador ${currentPlayer+1}…`;
  };
  r.onresult=e=>{
    let transcript="";
    for(let i=e.resultIndex;i<e.results.length;i++)
      transcript+=e.results[i][0].transcript;
    handleTranscript(transcript,e.results[e.results.length-1].isFinal);
  };
  r.onerror=()=>{
    el("micStatus").textContent="No se ha entendido bien. Puedes repetir o valorar manualmente.";
  };
  r.onend=()=>{
    recognizing=false;
    el("micDot").classList.remove("listening");
    if(running && !paused)
      el("micStatus").textContent="Micrófono en pausa · pulsa Repetir si no te ha oído";
  };
  return r;
}

function startListening(){
  if(!recognition) recognition=setupRecognition();
  if(!recognition) return;
  try{recognition.start();}catch(e){}
}

function handleTranscript(transcript,isFinal){
  const clean=transcript.trim();
  if(!clean) return;
  if(normalize(clean).includes("pasapalabra")){
    if(isFinal) doPass();
    return;
  }

  const w=playerWords[currentPlayer][idx[currentPlayer]];
  const isMatch=similar(clean,w.answer);
  el("answerBox").textContent=clean;
  el("answerBox").className="answer-box "+(isMatch?"correct":"wrong");
  setVerdictButtons(true);

  const rc=el("rcStatus");
  if(rc) rc.textContent=isMatch?"Suena correcta ✔":"No coincide con la respuesta";
  el("micStatus").textContent=isMatch
    ?"Suena correcta · pulsa Correcta o Enter para confirmar"
    :"No coincide · confirma manualmente si crees que es un error de dictado";
}

function stopAudio(){
  window.speechSynthesis.cancel();
  if(recognition && recognizing){
    try{recognition.stop();}catch(e){}
  }
}

function doCorrect(){
  if(!running) return;
  const w=playerWords[currentPlayer][idx[currentPlayer]];
  w.status="correct";
  correctCount[currentPlayer]++;
  advance(false);
}

function doWrong(){
  if(!running) return;
  const w=playerWords[currentPlayer][idx[currentPlayer]];
  w.status="wrong";
  wrongCount[currentPlayer]++;
  advance(true);
}

function doPass(){
  if(!running) return;
  const w=playerWords[currentPlayer][idx[currentPlayer]];
  if(w.status==="pending"){
    w.status="passed";
    passCount[currentPlayer]++;
  }
  advance(true);
}

function showSolution(){
  if(!running) return;
  const w=playerWords[currentPlayer][idx[currentPlayer]];
  stopAudio();
  el("answerBox").className="answer-box";
  el("answerBox").innerHTML=`<b>Solución: ${escapeHtml(w.answer)}</b>`;
  const rc=el("rcStatus");
  if(rc) rc.textContent=`Solución: ${escapeHtml(w.answer)}`;
  el("btnCorrect").disabled=false;
  el("btnWrong").disabled=false;
  el("micStatus").textContent="Solución mostrada · decide si marcar correcta o incorrecta";
}

function advance(switchPlayer){
  stopAudio();
  refreshRoscos();
  updateScore();

  const p=currentPlayer;
  const next=nextPendingIndex(p,idx[p]);

  if(next===-1){
    // Si este jugador ha terminado su rosco, pasa al otro si aún tiene preguntas.
    const other=1-p;
    const otherNext=nextPendingIndex(other,idx[other]-1);
    if(playerWords[other].some(w=>w.status==="pending")){
      currentPlayer=other;
      idx[other]=otherNext>=0?otherNext:0;
      setTimeout(startTurn,400);
      return;
    }
    finishGame();
    return;
  }

  idx[p]=next;

  if(switchPlayer){
    const other=1-p;
    if(playerWords[other].some(w=>w.status==="pending")){
      currentPlayer=other;
      const otherNext=nextPendingIndex(other,idx[other]);
      idx[other]=otherNext>=0?otherNext:0;
    }
  }

  setTimeout(startTurn,400);
}

function finishGame(){
  running=false;
  paused=false;
  clearInterval(timerId);
  stopAudio();

  const totalCorrect=correctCount[0]+correctCount[1];
  el("roscoCenter").innerHTML=`
    <div class="rc-idle">¡Roscos terminados!<br>
    <span style="color:var(--gold)">${totalCorrect} aciertos</span>
    </div>`;

  el("micStatus").textContent="Micrófono inactivo";
  setVerdictButtons(false);
  toggleTopButtons(false);
  el("btnPause").textContent="⏸ Pausa";
  refreshRoscos();
  speak(`Roscos terminados. ${totalCorrect} aciertos en total.`);
}

function formatTime(s){
  const m=Math.floor(s/60), sec=s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function tick(){
  if(!running || paused) return;
  timeLeft[currentPlayer]--;
  el("timer").textContent=formatTime(Math.max(timeLeft[currentPlayer],0));
  if(timeLeft[currentPlayer]<=0){
    // Tiempo agotado = fallo y cambio de jugador.
    doWrong();
  }
}

function toggleTopButtons(isRunning){
  el("btnStart").disabled=isRunning;
  el("btnPause").disabled=!isRunning;
  el("btnEdit").disabled=isRunning;
  el("secondsSelect").disabled=isRunning;
}

function resetGame(){
  running=false;
  paused=false;
  clearInterval(timerId);
  stopAudio();
  loadDefault();
  currentPlayer=0;
  idx=[0,0];
  timeLeft=[
    parseInt(el("secondsSelect").value,10),
    parseInt(el("secondsSelect").value,10)
  ];
  correctCount=[0,0];
  wrongCount=[0,0];
  passCount=[0,0];
  layoutAllRoscos();
  refreshRoscos();
  updateScore();
  el("timer").textContent=formatTime(timeLeft[0]);
  el("roscoCenter").innerHTML='<div class="rc-idle">Pulsa <b>Empezar</b><br>para jugar</div>';
  el("answerBox").innerHTML='<span class="placeholder">Aquí aparecerá lo que digas…</span>';
  el("micStatus").textContent="Micrófono inactivo";
  toggleTopButtons(false);
  el("btnPause").textContent="⏸ Pausa";
  setVerdictButtons(false);
}

el("btnStart").addEventListener("click",()=>{
  playerWords.forEach(list=>list.forEach(w=>w.status="pending"));
  correctCount=[0,0];
  wrongCount=[0,0];
  passCount=[0,0];
  currentPlayer=0;
  idx=[0,0];
  timeLeft=[
    parseInt(el("secondsSelect").value,10),
    parseInt(el("secondsSelect").value,10)
  ];
  running=true;
  paused=false;
  el("timer").textContent=formatTime(timeLeft[0]);
  toggleTopButtons(true);
  clearInterval(timerId);
  timerId=setInterval(tick,1000);
  startTurn();
});

el("btnPause").addEventListener("click",()=>{
  if(!running) return;
  if(!paused){
    paused=true;
    clearInterval(timerId);
    stopAudio();
    el("btnPause").textContent="▶ Reanudar";
    el("micStatus").textContent="En pausa";
    setVerdictButtons(false);
  }else{
    paused=false;
    timerId=setInterval(tick,1000);
    el("btnPause").textContent="⏸ Pausa";
    startTurn();
  }
});

el("btnRestart").addEventListener("click",resetGame);

el("secondsSelect").addEventListener("change",()=>{
  if(!running){
    const t=parseInt(el("secondsSelect").value,10);
    timeLeft=[t,t];
    el("timer").textContent=formatTime(t);
  }
});

el("btnCorrect").addEventListener("click",doCorrect);
el("btnWrong").addEventListener("click",doWrong);
el("btnPass").addEventListener("click",doPass);
el("btnSolution").addEventListener("click",showSolution);

el("btnRepeat").addEventListener("click",()=>{
  if(!running || paused) return;
  const w=playerWords[currentPlayer][idx[currentPlayer]];
  stopAudio();
  speak(`${w.letter}. ${w.clue}`,()=>{if(running&&!paused) startListening();});
});

el("btnEdit").addEventListener("click",()=>{
  el("wordsArea").value=wordsToText(playerWords[0]);
  el("editBackdrop").classList.add("open");
});

el("btnCancelEdit").addEventListener("click",()=>{
  el("editBackdrop").classList.remove("open");
});

el("btnSaveEdit").addEventListener("click",()=>{
  const parsed=parseWords(el("wordsArea").value);
  if(parsed.length>=3){
    // El mismo rosco editado se copia a los dos jugadores.
    playerWords=[parsed.map(w=>({...w})),parsed.map(w=>({...w}))];
    idx=[0,0];
    layoutAllRoscos();
    refreshRoscos();
    updateScore();
  }else{
    alert("Necesitas al menos 3 líneas válidas.");
  }
  el("editBackdrop").classList.remove("open");
});

document.addEventListener("keydown",e=>{
  if(el("editBackdrop").classList.contains("open")) return;
  if(e.key==="Enter" && !el("btnCorrect").disabled) doCorrect();
  else if((e.key==="x"||e.key==="X") && !el("btnWrong").disabled) doWrong();
  else if(e.key===" " && running && !paused){e.preventDefault();doPass();}
  else if(e.ctrlKey && (e.key==="r"||e.key==="R")){e.preventDefault();resetGame();}
});

// ---------- Inicialización ----------
loadDefault();
layoutAllRoscos();
refreshRoscos();
updateScore();
el("timer").textContent=formatTime(timeLeft[0]);
toggleTopButtons(false);
setVerdictButtons(false);
</script>
</body>
</html>
