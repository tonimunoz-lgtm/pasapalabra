<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador del Rosco Ganador - Pasapalabra</title>
<style>
  :root {
    --bg-main: #060d22;
    --bg-gradient: radial-gradient(circle at center, #112554 0%, #060c1f 80%);
    --panel-blue: rgba(16, 28, 59, 0.6);
    --panel-border: rgba(43, 67, 126, 0.4);
    --blue-bright: #3b82f6;
    --blue-glow: #1d4ed8;
    --text-white: #ffffff;
    --text-muted: #8fa0cd;
    --green-btn: #10b981;
    --yellow-btn: #f59e0b;
    --red-btn: #ef4444;
    --btn-dark: #1e293b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    background-image: var(--bg-gradient);
    color: var(--text-white);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .main-container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* --- Barra Superior de Configuración --- */
  .top-navbar {
    background: var(--panel-blue);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    border-radius: 50px;
    padding: 10px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
  }

  .nav-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-white);
  }

  .nav-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  select, input[type="number"] {
    background: #0b132b;
    border: 1px solid var(--panel-border);
    color: var(--text-white);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
  }

  .nav-btn {
    background: #ffffff;
    color: #000000;
    border: none;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .nav-btn.secondary { background: var(--panel-blue); color: var(--text-white); border: 1px solid var(--panel-border); }

  /* --- Distribución en Pantalla --- */
  .game-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 30px;
    align-items: start;
  }

  @media (max-width: 1024px) {
    .game-grid { grid-template-columns: 1fr; }
  }

  /* --- El Rosco (Zona Izquierda) --- */
  .rosco-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .rosco-wrapper {
    position: relative;
    width: min(65vh, 65vw, 560px);
    aspect-ratio: 1 / 1;
    margin: 20px 0;
  }

  /* Letras posicionadas en círculo */
  .letter-node {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #1d3573;
    border: 2px solid #25499c;
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }
  .letter-node.current {
    background: #ffffff !important;
    color: #0b132b !important;
    border-color: #ffffff !important;
    transform: translate(-50%, -50%) scale(1.25);
    z-index: 10;
  }
  .letter-node.correct { background: var(--green-btn); border-color: #059669; }
  .letter-node.wrong { background: var(--red-btn); border-color: #dc2626; }
  .letter-node.passed { background: var(--yellow-btn); border-color: #d97706; }

  /* Centro del Rosco */
  .rosco-center-box {
    position: absolute;
    inset: 22%;
    background: rgba(10, 20, 47, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }

  .center-big-letter {
    font-size: 4.5rem;
    font-weight: 800;
    color: var(--text-white);
    line-height: 1;
    margin-bottom: 10px;
  }

  .center-definition {
    font-size: 0.95rem;
    color: var(--text-muted);
    line-height: 1.4;
    overflow-y: auto;
    max-height: 120px;
  }

  .player-indicator-tag {
    background: var(--blue-bright);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  /* --- Panel Derecho (Marcadores) --- */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .scoreboard-card {
    background: var(--panel-blue);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
  }

  .panel-header-title {
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 6px;
  }

  .stats-row-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }

  .stat-mini-box {
    background: rgba(8, 14, 32, 0.7);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
  }
  .stat-mini-box .num { font-size: 1.3rem; font-weight: 700; display: block; }
  .stat-mini-box .label { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; display: block;}

  .player-container {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    margin-bottom: 10px;
  }
  .player-container.active-turn {
    background: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.3);
  }
  .player-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .player-time { color: var(--yellow-btn); font-variant-numeric: tabular-nums; }

  /* --- Barra Inferior de Respuestas --- */
  .bottom-action-bar {
    width: 100%;
    max-width: 600px;
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .input-row {
    width: 100%;
    display: flex;
    gap: 8px;
  }

  .text-input-field {
    flex: 1;
    background: #091024;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 0.95rem;
    color: white;
    outline: none;
  }
  .text-input-field::placeholder { color: #4b5563; }

  .action-btn {
    border: none;
    font-weight: bold;
    font-size: 0.85rem;
    padding: 0 20px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
  }
  .action-btn.ok { background: var(--green-btn); }
  .action-btn.pasar { background: var(--yellow-btn); color: #000; }
  .action-btn.solucion { background: #e2e8f0; color: #000; }
  .action-btn.fail { background: var(--red-btn); padding: 10px 24px; border-radius: 6px;}

  /* --- Modal Editor --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    width: 100%;
    max-width: 650px;
    border-radius: 12px;
    padding: 20px;
  }
  .modal-card h3 { margin-bottom: 10px; }
  textarea {
    width: 100%;
    height: 240px;
    background: #020617;
    color: #e2e8f0;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px;
    font-family: monospace;
    font-size: 0.85rem;
    resize: none;
  }
</style>
</head>
<body>

<div class="main-container">
  <!-- Navbar Superior -->
  <div class="top-navbar">
    <div class="nav-title">Simulador del Rosco Ganador - Modo Juego</div>
    
    <div class="nav-controls">
      <div class="nav-group">
        <label>Modo:</label>
        <select id="modeSelect" onchange="initGame()">
          <option value="1">1 Jugador</option>
          <option value="2" selected>2 Jugadores</option>
        </select>
      </div>

      <div class="nav-group">
        <label>Tiempo:</label>
        <input type="number" id="timeInput" value="150" style="width: 65px;" onchange="resetTimers()">
      </div>

      <button class="nav-btn secondary" onclick="openModal()">✏️ Editar palabras</button>
      <button class="nav-btn" id="btnPlayPause" onclick="togglePlay()">Empezar</button>
      <button class="nav-btn secondary" onclick="togglePauseGame()">Pausa</button>
      <button class="nav-btn secondary" onclick="initGame()">Reiniciar</button>
      <button class="nav-btn secondary" onclick="loadDefaultWords()">Nuevo rosco</button>
    </div>
  </div>

  <!-- Zona de Juego Central -->
  <div class="game-grid">
    
    <!-- Lado Izquierdo: El Rosco Activo -->
    <div class="rosco-section">
      <div class="rosco-wrapper" id="roscoWrapper">
        <div class="rosco-center-box">
          <div class="player-indicator-tag" id="centerPlayerTag">JUGADOR 1</div>
          <div class="center-big-letter" id="centerLetter">-</div>
          <div class="center-definition" id="centerClue">Pulsa "Empezar" para comenzar la partida.</div>
        </div>
      </div>

      <!-- Control de respuestas inferior -->
      <div class="bottom-action-bar">
        <div class="input-row">
          <input type="text" class="text-input-field" id="answerInput" placeholder="Escribe y pulsa Enter (o Espacio = pasar)..." disabled>
          <button class="action-btn ok" onclick="checkAnswer(true)">OK</button>
